<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="tara-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141B2D" />
      <stop offset="100%" stop-color="#0C101B" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)" stroke="#8B5CF6" stroke-width="2" stroke-opacity="0.5"/>
  <!-- Keycap base shape -->
  <rect x="8" y="8" width="48" height="48" rx="10" fill="#101524" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <!-- Glowing "T" with speed cursor bar -->
